name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flask

      - name: Run tests
        run: pytest
  deploy:
    needs:  [test]
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Trigger Render Deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
    
  smoke-test:
    needs: [deploy]  # This job waits for 'deploy' to finish successfully
    runs-on: ubuntu-latest
    steps:
      - name: Verify Health Endpoint
        run: |
          curl --fail --retry 36 --retry-delay 10 "https://keleweleai.onrender.com/health"